# where to put results
wdir: "./test/out_mir_eCLIP"

# input
infiles: "example_data/example_mir_eCLIP/IP10_WT1_miR181_R1_001_chr19_1000reads.fastq.gz example_data/example_mir_eCLIP/IP11_WT2_miR181_R1_001_chr19_1000reads.fastq.gz" # for multiple files after demultiplexing


#SAMPLES
samples: "IP10_WT1_miR181_R1_001_chr19_1000reads IP11_WT2_miR181_R1_001_chr19_1000reads" # sample name needs to be identical for read 1 and 2 of same sample


experiment_type: "miReCLIP"
quality_filter_barcodes: True
# if no demultiplexing is done, is there still a barcode


#adapter adapter_trimming
adapter_cycles: 2
adapter_trimming: True


genome_fasta: "example_data/example_annotation_mouse_chr19/annotation_mm10_chr19.fa" # has to be unzipped at the moment
gtf: "example_data/example_annotation_mouse_chr19/annotation_mm10_chr19.gtf" # accepts fa and fa.gz
read_length: 45

# Chimeric miR (miR-eCLIP specific)
# Generated by running example_data/example_mir_eCLIP/get_miRBase_mir_annotation.sh
# (downloads mature miRNA sequences from miRBase and filters to mouse mmu- entries).
mir_genome_fasta: "example_data/example_mir_eCLIP/mirBase_mm10_miRNAs_mature_sequence_genes.fasta"
mir_starts_allowed: "1 2 3 4"
